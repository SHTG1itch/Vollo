# Render.com blueprint — deploy the Vollo API on the free tier at $0.
#
# The cron sweeps run *inside* the API process (START_WORKER=true) so a single
# free web service covers the API + background telemetry. Point DATABASE_URL at
# a free Supabase Postgres+PostGIS instance.
#
#   1. Create a Supabase project (free) → copy the connection string.
#   2. New → Blueprint on Render, pick this repo.
#   3. Set DATABASE_URL when prompted. JWT_SECRET is generated for you.
#   4. After first deploy, run migrations once from the Render shell:
#        npm run migrate    (optionally: npm run seed)
services:
  - type: web
    name: vollo-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: START_WORKER
        value: "true"
      - key: NOMINATIM_USER_AGENT
        value: "Vollo/0.1 (contact@example.com)"
