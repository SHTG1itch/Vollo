# Local development stack for Vollo.
# Spins up PostgreSQL 16 with the PostGIS spatial extension so the geospatial
# domination engine (ST_ConvexHull / GIST spatial indexes) works exactly as it
# will on Supabase's free tier in production.
#
#   docker compose up -d      # start the database
#   docker compose down       # stop it (data persists in the named volume)
#   docker compose down -v    # stop it and wipe the data
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: vollo-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: vollo
      POSTGRES_PASSWORD: vollo
      POSTGRES_DB: vollo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vollo -d vollo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
